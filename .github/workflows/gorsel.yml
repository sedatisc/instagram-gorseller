name: Ürün görsellerini çek

# Claude'un çalıştığı kutu sermenkreatif.com ve filamentdepom.com'a
# çıkamıyor (403, egress politikası). Bu iş akışı GitHub koşucusunda
# çalışıyor; koşucunun tam internet erişimi var. Görselleri indirip
# arka planını kesiyor ve depoya işliyor, Claude da depodan okuyor.

on:
  workflow_dispatch:
    inputs:
      yenile:
        description: "Var olan görselleri de yeniden çek"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1"        # her pazartesi 03.17 UTC

permissions:
  contents: write

concurrency:
  group: gorsel-cek
  cancel-in-progress: false

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: rembg modelini önbellekten al
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-model-v1

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.32" "pillow>=10.4" \
                      "rembg==2.0.59" "onnxruntime>=1.18"

      - name: Görselleri çek
        env:
          U2NET_HOME: ~/.u2net
        run: |
          python3 otomasyon/cek.py ${{ inputs.yenile && '--yenile' || '' }}

      - name: Değişiklikleri işle
        run: |
          git config user.name  "gorsel-botu"
          git config user.email "noreply@github.com"
          # Tek tek ekleme: 'git add a b c' listedeki bir yol yoksa
          # tümden hata verip hiçbir şeyi stage'lemiyor.
          git add -A gorsel/urun otomasyon
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Ürün görselleri güncellendi (otomatik)"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Raporu iş özetine yaz
        if: always()
        run: cat otomasyon/SON-CALISMA.md >> $GITHUB_STEP_SUMMARY || true
