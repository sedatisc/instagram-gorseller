name: Buffer bağlantı kontrolü

# otomasyon/kontrol-istek.txt değişince çalışır: Buffer'a yalnız okuma
# sorgusu atar, hiçbir şey göndermez. Sonucu SON-BUFFER.md'ye yazar.

on:
  push:
    paths:
      - "otomasyon/kontrol-istek.txt"

permissions:
  contents: write

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "requests>=2.32"
      - name: Kontrol
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
        run: |
          if [ -z "$BUFFER_TOKEN" ]; then
            printf "# Buffer kontrolü\n\nBUFFER_TOKEN secret'ı bulunamadı.\n" > otomasyon/SON-BUFFER.md
          else
            python3 otomasyon/buffer_gonder.py --kontrol > /tmp/k.txt 2>&1 || true
            { echo "# Buffer kontrolü"; echo; echo '```'; tail -20 /tmp/k.txt; echo '```'; } > otomasyon/SON-BUFFER.md
          fi
      - name: Sonucu kaydet
        run: |
          git config user.name  "yayin-botu"
          git config user.email "noreply@github.com"
          git add otomasyon/SON-BUFFER.md
          git commit -m "Buffer kontrol sonucu" || exit 0
          git pull --rebase --autostash origin main
          git push origin HEAD:main
