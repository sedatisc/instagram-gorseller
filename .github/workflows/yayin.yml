name: Instagram yayını

# Kuyruk DURUM.json, saatler sira.py içinde. Bu iş akışı 20 dakikada bir
# bakıyor: vakti gelmiş ve defterde olmayan ne varsa Instagram Graph API
# ile yayınlıyor. Görseller depodan servis ediliyor (raw.githubusercontent),
# ayrı barındırma yok.
#
# Gereken secret'lar (Settings > Secrets and variables > Actions):
#   IG_USER_ID  Instagram işletme hesabının kimliği
#   IG_TOKEN    uzun ömürlü Facebook sayfa erişim anahtarı
# İkisi yoksa iş akışı sessizce bitiyor, yayın yapılmıyor.

on:
  workflow_dispatch:
    inputs:
      kuru:
        description: "Kuru çalışma — hiçbir şey yayınlanmaz, yalnız ne yapacağını yazar"
        type: boolean
        default: true
      zorla:
        description: "Tek işi vakti beklemeden yayınla (ör. 2026-10-11|3dbaski|gonderi)"
        type: string
        default: ""
  schedule:
    # Türkiye saatiyle 08.00 – 22.00 arası 20 dakikada bir. Cron 5-30 dakika
    # kayabiliyor; ızgara saatleri bu yüzden dakika hassasiyetinde değil,
    # yayinla.py 3 saati geçmiş işi atlıyor.
    - cron: "*/20 5-19 * * *"

permissions:
  contents: write

concurrency:
  group: instagram-yayin
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıklar
        run: pip install "requests>=2.32"

      - name: Yayınla
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -z "$IG_TOKEN" ] && [ "${{ inputs.kuru }}" != "true" ]; then
            echo "IG_TOKEN secret'ı yok — kuru çalışmaya düşülüyor." \
              >> $GITHUB_STEP_SUMMARY
            python3 otomasyon/yayinla.py --kuru
            exit 0
          fi
          python3 otomasyon/yayinla.py \
            ${{ inputs.kuru == true && '--kuru' || '' }} \
            ${{ inputs.zorla != '' && format('--zorla ''{0}''', inputs.zorla) || '' }}

      - name: Defteri işle
        if: always()
        run: |
          git config user.name  "yayin-botu"
          git config user.email "noreply@github.com"
          git add -A otomasyon
          if git diff --cached --quiet; then
            echo "Defterde değişiklik yok."
          else
            git commit -m "Yayın defteri güncellendi (otomatik)"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Raporu iş özetine yaz
        if: always()
        run: cat otomasyon/SON-YAYIN.md >> $GITHUB_STEP_SUMMARY || true
