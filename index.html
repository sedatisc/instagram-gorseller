 radial-gradient(900px 600px at 6% 0%,rgba(228,32,20,.10),transparent 62%),

/* personel cüzdanı: dijital, neon */
.cuzdan{position:relative;text-align:center;padding:26px 18px 20px;border-radius:28px;color:#fff;overflow:hidden;
 background:radial-gradient(120% 90% at 50% 0%,#4A2A28 0%,#2A1A19 60%,#1E1414 100%);
 box-shadow:0 0 0 1px rgba(255,140,125,.35),0 0 28px rgba(232,90,75,.35),0 18px 40px rgba(80,30,25,.35)}

function resimKucult(dosya, enBuyuk) {
  return new Promise(function (ok, red) {
    var u = URL.createObjectURL(dosya), im = new Image();
    im.onload = function () {
      var o = Math.min(1, (enBuyuk || 1600) / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * o); c.height = Math.round(im.height * o);
      var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', 0.78));
    };
    im.onerror = function () { URL.revokeObjectURL(u); red(new Error('Resim okunamadı')); };
    im.src = u;
  });
}

          satirBagla();
        }
        function kaydet(x, aktif) {
          return cagir('y_kisi_kaydet', { p_id: x ? x.id : null, p_ad: x && aktif !== undefined ? x.ad : q('#ka').value, p_kart: x && aktif !== undefined ? x.kart_no : q('#kk').value,
            p_birim: x && aktif !== undefined ? x.birim : q('#kb').value, p_misafir: x && aktif !== undefined ? x.misafir : q('#km').value === '1', p_aktif: aktif !== undefined ? aktif : (x ? x.aktif : true) });
        }
        q('#kkay').addEventListener('click', function () { kaydet(d).then(function () { uyar('Kaydedildi'); G.kisiler(); }).catch(sus); });
        if (d) q('#kvaz').addEventListener('click', function () { G.kisiler(); });
        q('#kk').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') ev.preventDefault(); });
        q('#kar').addEventListener('input', function (ev) { kisiAra = ev.target.value; satirlar(); });
        q('#afis').addEventListener('click', function () { afisYazdir(adres + '#ode'); });
        function satirBagla() {
        bagla('[data-kkod]', 'click', function (b) {
          var x = r.filter(function (z) { return z.id === +b.dataset.kkod; })[0];
          pencere('<h2>' + e(x.ad) + '</h2><div>' + karekodSvg(adres + '#k=' + x.link_kod) + '</div><div class="kucuk gri" style="text-align:center">Kişi bu karekodu telefonuyla okutur, 4 haneli şifresiyle girer.</div>');
        });
        bagla('[data-duz]', 'click', function (b) { G.kisiler(+b.dataset.duz); window.scrollTo(0, 0); });
        bagla('[data-aktif]', 'click', function (b) {
          var x = r.filter(function (z) { return z.id === +b.dataset.aktif; })[0];
          kaydet(x, !x.aktif).then(function () { G.kisiler(); }).catch(sus);
        });
        bagla('[data-sifir]', 'click', function (b) {
          var x = r.filter(function (z) { return z.id === +b.dataset.sifir; })[0];
          if (b.dataset.onay || !x.pin_var) cagir('y_kisi_sifirla', { p_id: x.id, p_link: false }).then(function (s) {
            pencere('<h2>' + e(x.ad) + '</h2><div class="gri">Yeni şifre</div><div id="ypin" style="font-size:54px;font-weight:800;letter-spacing:12px;text-align:center">' + e(s.pin) + '</div><div class="kucuk gri">Bu şifre bir daha gösterilmez, kişiye iletin.</div>');
            G.kisiler();
          }).catch(sus);
          else { b.dataset.onay = '1'; b.textContent = 'Emin misiniz?'; b.classList.add('ana'); }
        });
        bagla('[data-link]', 'click', function (b) {
          var u = adres + '#k=' + b.dataset.link;
          (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(function () { uyar('Bağlantı kopyalandı'); }, function () { window.prompt('Bağlantı', u); });
        });
        }
        satirlar();
      }).catch(sus);
    },
    ayarlar: function () {
      Promise.all([cagir('y_ayarlar'), cagir('y_gorevliler'), cagir('y_kisiler')]).then(function (sn) {
        var r = sn[0], gor = sn[1], kis = sn[2].filter(function (x) { return x.aktif && !x.misafir; });
        F = r.fis_kurus;
        var ROL = { yonetici: 'Yönetici', ocak: 'Çaycı' };
        function rolSec(v, id) { return '<select aria-label="Görev" data-gr="' + id + '">' + ['yonetici', 'ocak'].map(function (k) { return '<option value="' + k + '"' + (v === k ? ' selected' : '') + '>' + ROL[k] + '</option>'; }).join('') + '</select>'; }
        var gorevHtml = '<div class="kart sut"><h2>Görevliler</h2>' +
          '<div class="kucuk gri">Yönetici: nakit yükleme, rapor, kişiler, ayarlar. Çaycı: tablet ve dağıtım ekranı.</div>' +
          '<div class="tasma"><table><thead><tr><th>Ad</th><th>Görev</th><th>Durum</th><th>Yeni şifre</th><th></th></tr></thead><tbody>' +
          gor.map(function (g) {
            return '<tr><td>' + e(g.ad) + '</td><td>' + rolSec(g.rol, g.id) + '</td>' +
              '<td><select aria-label="Durum" data-gd="' + g.id + '"><option value="1">Aktif</option><option value="0"' + (g.aktif ? '' : ' selected') + '>Pasif</option></select></td>' +
              '<td><input type="password" aria-label="Yeni şifre" autocomplete="new-password" data-gs="' + g.id + '" placeholder="Değişmeyecekse boş"></td>' +
              '<td class="sag"><button class="d" data-gkay="' + g.id + '">Kaydet</button></td></tr>';
          }).join('') +
          '<tr><td><select aria-label="Kişi" data-gk=""><option value="">Kişi seçin</option>' +
          kis.filter(function (x) { return !gor.some(function (g) { return g.kisi_id === x.id; }); }).map(function (x) { return '<option value="' + x.id + '">' + e(x.ad) + '</option>'; }).join('') + '</select></td>' +
          '<td>' + rolSec('ocak', '') + '</td><td></td>' +
          '<td><input type="password" aria-label="Şifre" autocomplete="new-password" data-gs="" placeholder="En az 6 karakter"></td>' +
          '<td class="sag"><button class="d ana" data-gkay="">Ekle</button></td></tr></tbody></table></div></div>';
        govde(gorevHtml + '<div class="kart sut"><h2>Fiş ve limit</h2><div class="form">' +
          '<div><label for="af">1 fiş (₺)</label><input id="af" type="text" inputmode="decimal" value="' + sayi(r.fis_kurus / 100, 2) + '"></div>' +
          '<div><label for="al">Eksi limit (₺)</label><input id="al" type="text" inputmode="decimal" value="' + sayi(r.limit_kurus / 100, 2) + '"></div>' +
          '<button class="d ana" id="ab">Kaydet</button></div></div>' +
          '<div class="kart sut"><h2>Ürünler</h2><div class="tasma"><table><thead><tr><th>Ürün</th><th>Fiş</th><th>Fiyat</th><th>Sıra</th><th>Durum</th><th></th></tr></thead><tbody>' +
          r.urunler.concat([{ id: '', ad: '', fis: '', sira: r.urunler.length + 1, aktif: true }]).map(function (u) {
            return '<tr><td><input type="text" aria-label="Ürün adı" maxlength="40" data-ua="' + u.id + '" value="' + e(u.ad) + '"' + (u.id === '' ? ' placeholder="Yeni ürün"' : '') + '></td>' +
              '<td><input type="text" aria-label="Fiş" inputmode="numeric" style="width:80px" data-uf="' + u.id + '" value="' + u.fis + '"></td><td>' + (u.fis ? tl(u.fis * r.fis_kurus) : '') + '</td>' +
              '<td><input type="text" aria-label="Sıra" inputmode="numeric" style="width:70px" data-us="' + u.id + '" value="' + u.sira + '"></td>' +
              '<td><select aria-label="Durum" data-ud="' + u.id + '"><option value="1">Satışta</option><option value="0"' + (u.aktif ? '' : ' selected') + '>Kapalı</option></select></td>' +
              '<td class="sag"><button class="d" data-ukay="' + u.id + '">' + (u.id === '' ? 'Ekle' : 'Kaydet') + '</button></td></tr>';
          }).join('') + '</tbody></table></div></div>' +
          '<div class="kart sut"><h2>Ortak şifreler</h2><div class="form"><div><label for="sr">Giriş</label><select id="sr"><option value="ocak">Çay ocağı (tablet ve dağıtıcı)</option><option value="yonetici">Yönetici</option></select></div>' +
          '<div><label for="sy">Yeni şifre (4 rakam)</label><input id="sy" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" autocomplete="new-password"></div><button class="d ana" id="sb">Değiştir</button></div></div>' +
          '<div><button class="d" id="cik">Yönetici çıkışı</button></div>');
        q('#ab').addEventListener('click', function () {
          var f = tlOku(q('#af').value), l = tlOku(q('#al').value);
          if (isNaN(f) || f < 1 || isNaN(l) || l < 0) { uyar('Değer geçersiz', true); return; }
          cagir('y_ayar_kaydet', { p_fis_kurus: f, p_limit_kurus: l }).then(function () { uyar('Kaydedildi'); G.ayarlar(); }).catch(sus);
        });
        bagla('[data-ukay]', 'click', function (b) {
          var i = b.dataset.ukay, s = function (a) { return q('[data-' + a + '="' + i + '"]').value.trim(); };
          if (!s('ua') || !/^\d+$/.test(s('uf')) || +s('uf') < 1) { uyar('Bilgiler eksik', true); return; }
          cagir('y_urun_kaydet', { p_id: i === '' ? null : +i, p_ad: s('ua'), p_fis: +s('uf'), p_sira: /^\d+$/.test(s('us')) ? +s('us') : null, p_aktif: s('ud') === '1' }).then(function () { uyar('Kaydedildi'); G.ayarlar(); }).catch(sus);
        });
        bagla('[data-gkay]', 'click', function (b) {
          var i = b.dataset.gkay, v = function (a) { var x = q('[data-' + a + '="' + i + '"]'); return x ? x.value : ''; };
          cagir('y_gorevli_kaydet', { p_id: i === '' ? null : +i, p_kisi: i === '' ? (+v('gk') || null) : null, p_rol: v('gr'), p_sifre: v('gs'), p_aktif: i === '' ? true : v('gd') === '1' })
            .then(function () { uyar('Kaydedildi'); G.ayarlar(); }).catch(sus);
        });
        q('#sb').addEventListener('click', function () {
          cagir('y_sifre', { p_rol: q('#sr').value, p_yeni: q('#sy').value }).then(function () { uyar('Şifre değişti'); q('#sy').value = ''; }).catch(sus);
        });
        q('#cik').addEventListener('click', function () { koy('cay_yonetici', null); yonetici(); });
      }).catch(sus);
    }
  };
  function ciz() {
    app.innerHTML = bas('Yönetici', true) + '<nav class="sekme" aria-label="Bölümler">' + SEKMELER.map(function (s) { return '<button data-sekme="' + s[0] + '"' + (s[0] === sekme ? ' class="acik" aria-current="page"' : '') + '>' + s[1] + '</button>'; }).join('') + '</nav><main class="ic" id="govde"></main>';
    bagla('[data-sekme]', 'click', function (b) { sekme = b.dataset.sekme; ciz(); });
    cikisBagla(function () { koy('cay_yonetici', null); yonetici(); });
    G[sekme]();
  }
  temizle();
  ciz();
}

/* ---------- yönlendirme ---------- */
function yonlendir() {
  var h = location.hash.replace(/^#/, '');
  if (al('cay_kiosk') === '1') {
    if (h !== 'ocak') history.replaceState(null, '', '#ocak');
    if (ocakAcik) return;
    h = 'ocak';
  }
  temizle();
  if (h.indexOf('k=') === 0) {
    var kod = h.slice(2);
    if (kod !== al('cay_link')) { koy('cay_link', kod); koy('cay_kisi', null); }
    personel(false); return;
  }
  if (h === 'ocak') ocak();
  else if (h === 'dagitici') dagitici();
  else if (h === 'yonetici') yonetici();
  else personel(h === 'ode');
}
window.addEventListener('hashchange', yonlendir);
yonlendir();
})();
</script>
</body>
</html>
