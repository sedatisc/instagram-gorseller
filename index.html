<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html.kiosk,html.kiosk body{touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-touch-callout:none}
html.kiosk input{-webkit-user-select:text;user-select:text}
body{background:#F6F5F2;color:#1C1B1A;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.35}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2{margin:0;font-weight:700}
h2{font-size:20px}
.bas{background:#1C1B1A;color:#F6F5F2;padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.kurum{display:flex;align-items:center;gap:12px}
.kurum img{width:44px;height:44px;border-radius:50%;background:#fff;object-fit:cover;flex-shrink:0}
.kurum b{display:block;font-size:14px}
.kurum span{display:block;font-size:11px;color:#D9D6CF;line-height:1.3}
.bas .ad{font-size:22px;font-weight:700}
.urun{text-align:center;line-height:1.1}
.urun b{display:block;font-size:26px;letter-spacing:.5px;color:#E8C27A}
.urun span{display:block;font-size:11px;color:#D9D6CF}
.ic{max-width:1200px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.dar{max-width:480px}
.kart{background:#fff;border:1px solid #DEDBD3;border-radius:14px;padding:16px}
.secili{border:2px solid #8F2A1B}
.sat{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sut{display:flex;flex-direction:column;gap:10px}
.gri{color:#5C5850}
.kirmizi{color:#8F2A1B;font-weight:700}
.yesil{color:#1B6B45;font-weight:700}
.kucuk{font-size:14px}
.buyuk{font-size:34px;font-weight:700;line-height:1.1}
.d{height:48px;padding:0 18px;border-radius:10px;border:1px solid #B9B5AB;background:#fff;font-weight:600}
.d.ana{background:#8F2A1B;border-color:#8F2A1B;color:#fff}
.d.koyu{background:#1C1B1A;border-color:#1C1B1A;color:#fff}
.d.tam{width:100%;height:58px;font-size:18px}
.d:disabled{opacity:.5}
.yuv{width:48px;height:48px;border-radius:24px;border:1px solid #B9B5AB;background:#fff;font-size:24px;line-height:1;padding:0}
.yuv.koyu{background:#1C1B1A;border-color:#1C1B1A;color:#fff}
.adet{min-width:28px;text-align:center;font-size:22px;font-weight:700}
label{font-size:13px;font-weight:600;color:#5C5850;display:block;margin-bottom:6px}
input[type=text],input[type=search],input[type=password],input[type=date],input[type=number],select{height:48px;width:100%;border:1px solid #B9B5AB;border-radius:10px;padding:0 12px;background:#fff}
.form{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.form>div{flex:1;min-width:150px}
.form>button{flex:0 0 auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;color:#5C5850;font-weight:600;padding:10px 8px;border-bottom:1px solid #DEDBD3}
td{padding:10px 8px;border-bottom:1px solid #ECE9E2;vertical-align:middle}
.sag{text-align:right}
.tasma{overflow-x:auto}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.kpi .kart div:first-child{font-size:14px;color:#5C5850}
.kpi .kart div:nth-child(2){font-size:28px;font-weight:700;margin:6px 0}
.sekme{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid #DEDBD3}
.sekme button{height:44px;padding:0 16px;border-radius:22px;border:1px solid #B9B5AB;background:#fff;font-weight:600;white-space:nowrap}
.sekme button.acik{background:#1C1B1A;border-color:#1C1B1A;color:#fff}
.uyari{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1C1B1A;color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;max-width:90%;z-index:9;text-align:center}
.uyari.hata{background:#8F2A1B}
.tablet{display:flex;gap:24px;padding:20px 28px;min-height:calc(100vh - 72px)}
.tablet>section{display:flex;flex-direction:column;gap:12px}
.tablet .sol{width:42%}
.tablet .sagk{flex:1}
.sonuc{flex:1;min-height:150px;border-radius:16px;padding:20px 24px;display:flex;align-items:center;gap:18px;border:2px dashed #B9B5AB;background:#fff}
.sonuc.ok{border:2px solid #1B6B45;background:#E7F2EC}
.sonuc.red{border:2px solid #8F2A1B;background:#F7E7E4}
.sonuc .isim{font-size:38px;font-weight:700;line-height:1.05}
.rozet{min-width:36px;height:36px;padding:0 10px;border-radius:18px;background:#8F2A1B;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.pasif{opacity:.55}
.perde{position:fixed;inset:0;background:rgba(28,27,26,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.perde svg{width:100%;height:auto;max-width:320px;margin:0 auto;display:block}
@media (max-width:820px){.tablet{flex-direction:column;padding:14px}.tablet .sol{width:100%}}

/* cam görünüm */
body{background:linear-gradient(135deg,#F3E3C8 0%,#E9C79A 30%,#C9895E 62%,#8F3B2A 100%) fixed;min-height:100vh}
.bas{background:rgba(28,27,26,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.18);position:sticky;top:0;z-index:5}
.kart,.sonuc,.sekme,.perde>.kart{background:rgba(255,255,255,.52);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border:1px solid rgba(255,255,255,.65);box-shadow:0 8px 32px rgba(60,30,10,.18)}
.kart{border-radius:18px}
.sekme{border-radius:0;border-left:0;border-right:0;box-shadow:none}
.secili{border:2px solid rgba(143,42,27,.85)}

.d.koyu,.yuv.koyu,.sekme button.acik{background:rgba(28,27,26,.82);border-color:rgba(255,255,255,.25)}
input[type=text],input[type=search],input[type=password],input[type=date],input[type=number],select,textarea{background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9)}
th{border-bottom-color:rgba(92,88,80,.25)} td{border-bottom-color:rgba(92,88,80,.15)}
.sonuc{border:2px dashed rgba(255,255,255,.9)}
.sonuc.ok{background:rgba(231,242,236,.78);border:2px solid #1B6B45}
.sonuc.red{background:rgba(247,231,228,.8);border:2px solid #8F2A1B}
.uyari{background:rgba(28,27,26,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.uyari.hata{background:rgba(143,42,27,.9)}
</style>

<body>

<div id="uyari" class="uyari" hidden></div>
<script src="ayar.js"></script>
<script src="qr.js"></script>
<script>
(function () {
'use strict';
var A = window.CAY_AYAR || {};
var app = document.getElementById('app');
var BIRIMLER = ['Yapı İşleri ve Teknik Daire Başkanlığı', 'İdari ve Mali İşler Daire Başkanlığı'];
var F = 250, LIMIT = 25000, zamanlayici = null, tusDinle = null;

function e(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function sayi(n, o) { return Number(n).toLocaleString('tr-TR', { minimumFractionDigits: o, maximumFractionDigits: o }); }
function tl(k) { return sayi(k / 100, 2) + ' ₺'; }
function fis(k) { var f = k / F; return (f < 0 ? '−' : '') + Number(Math.abs(f)).toLocaleString('tr-TR', { maximumFractionDigits: 1 }) + ' fiş'; }
function ikili(k) { return fis(k) + ' · ' + (k < 0 ? '−' : '') + tl(Math.abs(k)); }
function tlOku(s) { var t = String(s).trim().replace(/\./g, '').replace(',', '.'); if (!/^-?\d+(\.\d{1,2})?$/.test(t)) return NaN; return Math.round(parseFloat(t) * 100); }
function bugun() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function ayBasi() { return bugun().slice(0, 8) + '01'; }
function al(k) { try { return localStorage.getItem(k); } catch (x) { return null; } }
function koy(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (x) { } }
function q(s) { return document.querySelector(s); }
function hepsi(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
function bagla(s, olay, f) { hepsi(s).forEach(function (el) { el.addEventListener(olay, function (ev) { f(el, ev); }); }); }

var uyariZ = null;
function uyar(m, hata) {
  var u = document.getElementById('uyari');
  u.textContent = m; u.className = 'uyari' + (hata ? ' hata' : ''); u.hidden = false;
  clearTimeout(uyariZ); uyariZ = setTimeout(function () { u.hidden = true; }, 3500);
}

function istekNo() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (x) { }
  return Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
}
function rpc(fn, a) {
  if (!A.url || !A.anahtar) return Promise.reject(new Error('Sunucu ayarı yapılmamış'));
  var ctl = window.AbortController ? new AbortController() : null, z = setTimeout(function () { if (ctl) ctl.abort(); }, 15000);
  return fetch(A.url.replace(/\/$/, '') + '/rest/v1/rpc/' + fn, {
    method: 'POST', headers: { 'Content-Type': 'application/json', apikey: A.anahtar }, body: JSON.stringify(a || {}), signal: ctl ? ctl.signal : undefined
  }).then(function (r) {
    clearTimeout(z);
    return r.json().catch(function () { return null; }).then(function (j) {
      if (!r.ok) throw new Error((j && j.message) || 'Bağlantı hatası');
      return j;
    });
  }, function () { clearTimeout(z); throw new Error('Bağlantı yok'); });
}
/* aynı istek kimliğiyle yeniden dener; sunucu ikinci kez düşmez */
function rpcTekrarli(fn, a) {
  return rpc(fn, a).catch(function (h) {
    if (h.message !== 'Bağlantı yok') throw h;
    return new Promise(function (ok) { setTimeout(ok, 1500); }).then(function () { return rpc(fn, a); });
  });
}

function kurum() {
  return '<div class="kurum"><img src="logo.png" alt="Amasya Üniversitesi logosu"><div><b>Amasya Üniversitesi</b>' +
    '<span>' + e(BIRIMLER[0]) + '<br>' + e(BIRIMLER[1]) + '</span></div></div>' +
    '<div class="urun"><b>ÇayFiş</b><span>Çay Ocağı Bakiye Sistemi</span></div>';
}
function bas(baslik) { return '<header class="bas">' + kurum() + '<div class="ad">' + e(baslik) + '</div></header>'; }
function temizle() { clearInterval(zamanlayici); zamanlayici = null; if (tusDinle) { document.removeEventListener('keydown', tusDinle); tusDinle = null; } }

var sesBaglam = null;
function sesAc() {
  try {
    if (!sesBaglam) { var C = window.AudioContext || window.webkitAudioContext; sesBaglam = new C(); }
    if (sesBaglam.state === 'suspended') sesBaglam.resume();
  } catch (x) { }
}
var ekranKilidi = null;
function ekranAcikTut() {
  try {
    if (navigator.wakeLock && document.visibilityState === 'visible') navigator.wakeLock.request('screen').then(function (k) { ekranKilidi = k; }, function () { });
  } catch (x) { }
}
document.addEventListener('visibilitychange', function () { if (ekranKilidi !== null && document.visibilityState === 'visible') ekranAcikTut(); });
function bip() {
  try {
    sesAc(); var c = sesBaglam;
    [0, 0.25].forEach(function (t) {
      var o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; o.connect(g); g.connect(c.destination);
      g.gain.setValueAtTime(0.25, c.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + t + 0.2);
      o.start(c.currentTime + t); o.stop(c.currentTime + t + 0.2);
    });
  } catch (x) { }
}

function urunSatirlari(urunler, adet) {
  return urunler.map(function (u) {
    var n = adet[u.id] || 0;
    return '<div class="kart sat' + (n ? ' secili' : '') + '"><div><div style="font-size:19px;font-weight:700">' + e(u.ad) + '</div>' +
      '<div class="gri kucuk">' + u.fis + ' fiş · ' + tl(u.fis * F) + '</div></div>' +
      '<div class="sat"><button class="yuv" data-eksi="' + u.id + '" aria-label="' + e(u.ad) + ' azalt">−</button>' +
      '<div class="adet">' + n + '</div>' +
      '<button class="yuv koyu" data-arti="' + u.id + '" aria-label="' + e(u.ad) + ' artır">+</button></div></div>';
  }).join('');
}
function kalemler(adet) { return Object.keys(adet).filter(function (i) { return adet[i] > 0; }).map(function (i) { return { urun_id: +i, adet: adet[i] }; }); }
function toplamFis(urunler, adet) { return urunler.reduce(function (t, u) { return t + u.fis * (adet[u.id] || 0); }, 0); }
function adetBagla(adet, ciz) {
  bagla('[data-arti]', 'click', function (b) { var i = b.dataset.arti; adet[i] = Math.min(20, (adet[i] || 0) + 1); ciz(); });
  bagla('[data-eksi]', 'click', function (b) { var i = b.dataset.eksi; adet[i] = Math.max(0, (adet[i] || 0) - 1); ciz(); });
}

/* ---------- karekod ---------- */
function karekodSvg(metin) {
  var k = qrcode(0, 'M'); k.addData(metin); k.make();
  return k.createSvgTag({ cellSize: 8, margin: 4, scalable: true });
}
function pencere(html) {
  var d = document.createElement('div');
  d.className = 'perde';
  d.innerHTML = '<div class="kart sut" role="dialog" aria-modal="true" style="max-width:420px;width:100%">' + html + '<button class="d tam" data-kapat>Kapat</button></div>';
  document.body.appendChild(d);
  d.addEventListener('click', function (ev) { if (ev.target === d || ev.target.hasAttribute('data-kapat')) d.remove(); });
  d.kapat = function () { d.remove(); };
  return d;
}
function afisYazdir(adres) {
  var w = window.open('', '_blank');
  if (!w) { uyar('Açılır pencereye izin verin', true); return; }
  w.document.write('<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Çay Ocağı Karekod</title><style>' +
    '@page{size:A4;margin:18mm}body{font-family:system-ui,Arial,sans-serif;text-align:center;color:#1C1B1A;margin:0}' +
    'img{width:30mm;height:30mm}h1{font-size:40pt;margin:8mm 0 2mm}p{font-size:16pt;margin:2mm 0}.k svg{width:120mm;height:120mm}.b{font-size:11pt;color:#444}</style></head><body>' +
    '<img src="' + new URL('logo.png', location.href).href + '" alt=""><div class="b">Amasya Üniversitesi<br>' + e(BIRIMLER[0]) + ' · ' + e(BIRIMLER[1]) + '</div>' +
    '<h1>Çay Ocağı</h1><p>Telefonunuzun kamerasıyla okutun, seçin, ödeyin.</p><div class="k">' + karekodSvg(adres) + '</div>' +
    '<p class="b">' + e(adres) + '</p><script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script></body></html>');
  w.document.close();
}

/* ---------- şifre ekranı ---------- */
function sifreEkrani(baslik, etiket, pin, gonder) {
  app.innerHTML = bas(baslik) + '<main class="ic dar"><form class="kart sut" id="gf"><div><label for="gs">' + e(etiket) + '</label>' +
    '<input id="gs" type="password" autocomplete="off" ' + (pin ? 'inputmode="numeric" maxlength="4" pattern="[0-9]{4}"' : '') + ' required></div>' +
    '<button class="d ana tam">Giriş</button></form></main>';
  q('#gf').addEventListener('submit', function (ev) {
    ev.preventDefault();
    gonder(q('#gs').value).catch(function (h) { uyar(h.message, true); });
  });
  q('#gs').focus();
}
function rolGiris(rol, baslik, sonra) {
  sifreEkrani(baslik, 'Şifre', false, function (s) {
    return rpc('giris_rol', { p_rol: rol, p_sifre: s }).then(function (r) {
      if (r.hata) throw new Error(r.hata);
      koy('cay_' + rol, r.oturum); sonra();
    });
  });
}
function oturumHatasi(h, anahtar, sonra) {
  if (h.message === 'OTURUM') { koy(anahtar, null); sonra(); return true; }
  uyar(h.message, true); return false;
}

/* ---------- personel: sipariş ve karekodla ödeme ---------- */
function personel(ode) {
  var o = al('cay_kisi'), link = al('cay_link');
  if (!o) {
    if (!link) {
      app.innerHTML = bas('Çay Ocağı') + '<main class="ic dar"><div class="kart">Size gönderilen kişisel bağlantıyı ya da karekodu bu telefonda bir kez açın.</div></main>';
      return;
    }
    rpc('kisi_on', { p_link: link }).then(function (r) {
      if (r.hata) { app.innerHTML = bas('Çay Ocağı') + '<main class="ic dar"><div class="kart">' + e(r.hata) + '</div></main>'; return; }
      sifreEkrani(r.ad, r.pin_var ? '4 haneli şifreniz' : '4 haneli bir şifre belirleyin', true, function (p) {
        return rpc('giris_kisi', { p_link: link, p_pin: p }).then(function (g) {
          if (g.hata) throw new Error(g.hata);
          koy('cay_kisi', g.oturum); personel(ode);
        });
      });
    }).catch(function (h) { uyar(h.message, true); });
    return;
  }
  var veri = null, adet = {}, mesgul = false, istek = null;
  function yukle() {
    return rpc('kisi_durum', { p_o: o }).then(function (r) { veri = r; F = r.fis_kurus; LIMIT = r.limit_kurus; ciz(); })
      .catch(function (h) { oturumHatasi(h, 'cay_kisi', function () { personel(ode); }); });
  }
  function ciz() {
    var t = toplamFis(veri.urunler, adet) * F, yer = al('cay_yer') || '';
    var eski = q('#yer'); if (eski) yer = eski.value;
    var kul = veri.bakiye_kurus + veri.limit_kurus;
    app.innerHTML = '<header class="bas">' + kurum() + '</header>' +
      '<div class="bas" style="padding-top:0;display:block"><div class="kucuk" style="color:#D9D6CF">' + e(veri.ad) + ' · Bakiye</div>' +
      '<div class="buyuk">' + fis(veri.bakiye_kurus) + ' <span style="font-size:18px;font-weight:400;color:#D9D6CF">' + (veri.bakiye_kurus < 0 ? '−' : '') + tl(Math.abs(veri.bakiye_kurus)) + '</span></div>' +
      '<div class="kucuk" style="color:#D9D6CF">Kullanılabilir: ' + (kul > 0 ? fis(kul) : '0 fiş') + '</div></div>' +
      '<main class="ic dar">' +
      (veri.bekleyen.length ? '<h2>Bekleyen siparişiniz</h2>' + veri.bekleyen.map(function (s) {
        return '<div class="kart sut secili"><div class="sat"><b>' + e(s.ozet) + '</b><span class="gri kucuk">' + e(s.saat) + '</span></div>' +
          '<div class="sat"><span class="gri kucuk">' + e(s.yer || '') + ' · Hazırlanıyor</span><button class="d" data-kiptal="' + s.id + '">İptal et</button></div></div>';
      }).join('') : '') +
      '<h2>' + (ode ? 'Çay ocağında ödeme' : 'Sipariş') + '</h2>' + urunSatirlari(veri.urunler, adet) +
      (ode ? '' : '<div><label for="yer">Nereye getirilsin</label><input id="yer" type="text" maxlength="80" value="' + e(yer) + '"></div>') +
      '<div class="kart sut kucuk"><div class="sat"><span class="gri">Toplam</span><b>' + ikili(t) + '</b></div>' +
      '<div class="sat"><span class="gri">Sonrası</span><b>' + ikili(veri.bakiye_kurus - t) + '</b></div></div>' +
      '<button class="d ana tam" id="gonder"' + (t && !mesgul ? '' : ' disabled') + '>' + (ode ? 'Öde' : 'Sipariş ver') + (t ? ' · ' + fis(t) : '') + '</button>' +
      '<a class="d" style="display:flex;align-items:center;justify-content:center;text-decoration:none;color:#1C1B1A" href="#' + (ode ? '' : 'ode') + '">' + (ode ? 'Odama sipariş ver' : 'Çay ocağındayım, burada öde') + '</a>' +

          r.urunler.concat([{ id: '', ad: '', fis: '', sira: r.urunler.length + 1, aktif: true }]).map(function (u) {
            return '<tr><td><input type="text" aria-label="Ürün adı" maxlength="40" data-ua="' + u.id + '" value="' + e(u.ad) + '"' + (u.id === '' ? ' placeholder="Yeni ürün"' : '') + '></td>' +
              '<td><input type="text" aria-label="Fiş" inputmode="numeric" style="width:80px" data-uf="' + u.id + '" value="' + u.fis + '"></td><td>' + (u.fis ? tl(u.fis * r.fis_kurus) : '') + '</td>' +
              '<td><input type="text" aria-label="Sıra" inputmode="numeric" style="width:70px" data-us="' + u.id + '" value="' + u.sira + '"></td>' +
              '<td><select aria-label="Durum" data-ud="' + u.id + '"><option value="1">Satışta</option><option value="0"' + (u.aktif ? '' : ' selected') + '>Kapalı</option></select></td>' +
              '<td class="sag"><button class="d" data-ukay="' + u.id + '">' + (u.id === '' ? 'Ekle' : 'Kaydet') + '</button></td></tr>';
          }).join('') + '</tbody></table></div></div>' +
          '<div class="kart sut"><h2>Şifre değiştir</h2><div class="form"><div><label for="sr">Giriş</label><select id="sr"><option value="ocak">Çay ocağı (tablet ve dağıtıcı)</option><option value="yonetici">Yönetici</option></select></div>' +
          '<div><label for="sy">Yeni şifre (en az 6 karakter)</label><input id="sy" type="password" autocomplete="new-password"></div><button class="d ana" id="sb">Değiştir</button></div></div>' +
          '<div><button class="d" id="cik">Yönetici çıkışı</button></div>');
        q('#ab').addEventListener('click', function () {
          var f = tlOku(q('#af').value), l = tlOku(q('#al').value);
          if (isNaN(f) || f < 1 || isNaN(l) || l < 0) { uyar('Değer geçersiz', true); return; }
          cagir('y_ayar_kaydet', { p_fis_kurus: f, p_limit_kurus: l }).then(function () { uyar('Kaydedildi'); G.ayarlar(); }).catch(sus);
        });
        bagla('[data-ukay]', 'click', function (b) {
          var i = b.dataset.ukay, s = function (a) { return q('[data-' + a + '="' + i + '"]').value.trim(); };
          if (!s('ua') || !/^\d+$/.test(s('uf')) || +s('uf') < 1) { uyar('Bilgiler eksik', true); return; }
          cagir('y_urun_kaydet', { p_id: i === '' ? null : +i, p_ad: s('ua'), p_fis: +s('uf'), p_sira: /^\d+$/.test(s('us')) ? +s('us') : null, p_aktif: s('ud') === '1' }).then(function () { uyar('Kaydedildi'); G.ayarlar(); }).catch(sus);
        });
        q('#sb').addEventListener('click', function () {
          cagir('y_sifre', { p_rol: q('#sr').value, p_yeni: q('#sy').value }).then(function () { uyar('Şifre değişti'); q('#sy').value = ''; }).catch(sus);
        });
        q('#cik').addEventListener('click', function () { koy('cay_yonetici', null); yonetici(); });
      }).catch(sus);
    }
  };
  function ciz() {
    app.innerHTML = bas('Yönetici') + '<nav class="sekme" aria-label="Bölümler">' + SEKMELER.map(function (s) { return '<button data-sekme="' + s[0] + '"' + (s[0] === sekme ? ' class="acik" aria-current="page"' : '') + '>' + s[1] + '</button>'; }).join('') + '</nav><main class="ic" id="govde"></main>';
    bagla('[data-sekme]', 'click', function (b) { sekme = b.dataset.sekme; ciz(); });
    G[sekme]();
  }
  temizle();
  ciz();
}

/* ---------- yönlendirme ---------- */
function yonlendir() {
  var h = location.hash.replace(/^#/, '');
  if (al('cay_kiosk') === '1') {
    if (h !== 'ocak') history.replaceState(null, '', '#ocak');
    if (ocakAcik) return;
    h = 'ocak';
  }
  temizle();
  if (h.indexOf('k=') === 0) {
    var kod = h.slice(2);
    if (kod !== al('cay_link')) { koy('cay_link', kod); koy('cay_kisi', null); }
    personel(false); return;
  }
  if (h === 'ocak') ocak();
  else if (h === 'dagitici') dagitici();
  else if (h === 'yonetici') yonetici();
  else personel(h === 'ode');
}
window.addEventListener('hashchange', yonlendir);
yonlendir();
})();
</script>
</body>
</html>
